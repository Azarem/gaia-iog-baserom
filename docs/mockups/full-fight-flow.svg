<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="p1color" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8866"/>
      <stop offset="100%" stop-color="#cc4422"/>
    </linearGradient>
    <linearGradient id="p2color" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4422"/>
      <stop offset="100%" stop-color="#aa1100"/>
    </linearGradient>
    <linearGradient id="p3color" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22ffaa"/>
      <stop offset="100%" stop-color="#0088aa"/>
    </linearGradient>
    <linearGradient id="transColor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcc44"/>
      <stop offset="100%" stop-color="#cc8800"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#888888"/>
    </marker>
    <marker id="arrowD" markerWidth="8" markerHeight="10" refX="4" refY="9" orient="auto">
      <polygon points="0,0 8,0 4,10" fill="#888888"/>
    </marker>
  </defs>

  <rect width="800" height="500" rx="8" fill="#0a0a14"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="monospace" font-size="18" fill="#ffffff" font-weight="bold">Unused Mode 7 Boss — Full Fight Flow</text>
  <text x="400" y="48" text-anchor="middle" font-family="monospace" font-size="10" fill="#666666">Proposed restoration with Mode 7 enhancement</text>

  <!-- ====== PHASE 1 BOX ====== -->
  <rect x="30" y="65" width="200" height="200" rx="8" fill="#1a1020" stroke="#ff8866" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="65" width="200" height="28" rx="8" fill="url(#p1color)"/>
  <rect x="30" y="82" width="200" height="11" fill="url(#p1color)"/>
  <text x="130" y="84" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffffff" font-weight="bold">PHASE 1</text>

  <!-- Miniature scene -->
  <rect x="50" y="100" width="160" height="80" rx="4" fill="#180830"/>
  <!-- Mini core -->
  <ellipse cx="130" cy="125" rx="18" ry="14" fill="#882222" stroke="#cc4444" stroke-width="1"/>
  <circle cx="130" cy="122" r="4" fill="#ff4422" opacity="0.7"/>
  <!-- Mini bits -->
  <rect x="70" y="112" width="14" height="14" rx="2" fill="#224488" stroke="#4488cc" stroke-width="1"/>
  <rect x="176" y="112" width="14" height="14" rx="2" fill="#224488" stroke="#4488cc" stroke-width="1"/>
  <!-- Mini launchers -->
  <rect x="56" y="140" width="10" height="14" rx="2" fill="#553388"/>
  <rect x="194" y="140" width="10" height="14" rx="2" fill="#553388"/>
  <!-- Mini player -->
  <rect x="125" y="155" width="8" height="12" rx="1" fill="#4466aa"/>
  <circle cx="129" cy="150" r="4" fill="#ffcc99"/>
  <!-- Bubbles -->
  <circle cx="90" cy="148" r="4" fill="#aa44ee" opacity="0.5"/>
  <circle cx="165" cy="145" r="3" fill="#aa44ee" opacity="0.5"/>

  <!-- Phase 1 description -->
  <text x="130" y="196" text-anchor="middle" font-family="monospace" font-size="8" fill="#cccccc">Core invulnerable</text>
  <text x="130" y="208" text-anchor="middle" font-family="monospace" font-size="8" fill="#cccccc">Kill both Bits to advance</text>
  <text x="130" y="220" text-anchor="middle" font-family="monospace" font-size="8" fill="#ff8866">Bubbles + Beams active</text>
  <text x="130" y="240" text-anchor="middle" font-family="monospace" font-size="7" fill="#888888">12 actors, ~45 OAM</text>
  <text x="130" y="252" text-anchor="middle" font-family="monospace" font-size="7" fill="#888888">BG Mode 1 (normal)</text>

  <!-- Arrow P1 → P2 -->
  <line x1="232" y1="165" x2="268" y2="165" stroke="#888888" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="250" y="155" text-anchor="middle" font-family="monospace" font-size="7" fill="#ffaa44" transform="rotate(-90 250 155)">Bits dead</text>

  <!-- ====== PHASE 2 BOX ====== -->
  <rect x="270" y="65" width="200" height="200" rx="8" fill="#1a1018" stroke="#ff4422" stroke-width="2" filter="url(#shadow)"/>
  <rect x="270" y="65" width="200" height="28" rx="8" fill="url(#p2color)"/>
  <rect x="270" y="82" width="200" height="11" fill="url(#p2color)"/>
  <text x="370" y="84" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffffff" font-weight="bold">PHASE 2</text>

  <!-- Miniature scene -->
  <rect x="290" y="100" width="160" height="80" rx="4" fill="#200818"/>
  <!-- Mini core (vulnerable, red) -->
  <ellipse cx="370" cy="125" rx="20" ry="16" fill="#aa2211" stroke="#ff4433" stroke-width="1.5"/>
  <circle cx="370" cy="122" r="5" fill="#ff2200"/>
  <!-- HP bar -->
  <rect x="354" y="143" width="32" height="3" rx="1" fill="#ff4422"/>
  <!-- Dead bits (dark) -->
  <rect x="310" y="112" width="14" height="14" rx="2" fill="#112233" opacity="0.5"/>
  <rect x="416" y="112" width="14" height="14" rx="2" fill="#112233" opacity="0.5"/>
  <!-- Nuke -->
  <circle cx="340" cy="110" r="6" fill="#ff8800" stroke="#ffcc00" stroke-width="1"/>
  <!-- Nuke pieces -->
  <circle cx="410" cy="135" r="3" fill="#ff6600"/>
  <circle cx="420" cy="148" r="3" fill="#ff6600"/>
  <circle cx="405" cy="150" r="3" fill="#ff6600"/>
  <!-- Fire rain -->
  <rect x="310" y="100" width="2" height="8" fill="#ff6600" opacity="0.6"/>
  <rect x="350" y="102" width="2" height="7" fill="#ff8800" opacity="0.5"/>
  <rect x="400" y="100" width="2" height="9" fill="#ff6600" opacity="0.7"/>
  <!-- Player attacking -->
  <rect x="355" y="155" width="8" height="12" rx="1" fill="#4466aa"/>
  <circle cx="359" cy="150" r="4" fill="#ffcc99"/>
  <line x1="365" y1="154" x2="375" y2="148" stroke="#ccddff" stroke-width="1.5"/>

  <!-- Phase 2 description -->
  <text x="370" y="196" text-anchor="middle" font-family="monospace" font-size="8" fill="#cccccc">Core now vulnerable</text>
  <text x="370" y="208" text-anchor="middle" font-family="monospace" font-size="8" fill="#cccccc">Nukes + fire rain attacks</text>
  <text x="370" y="220" text-anchor="middle" font-family="monospace" font-size="8" fill="#ff4422">Launchers still spawning</text>
  <text x="370" y="240" text-anchor="middle" font-family="monospace" font-size="7" fill="#888888">14 actors (peak), ~55 OAM</text>
  <text x="370" y="252" text-anchor="middle" font-family="monospace" font-size="7" fill="#888888">BG Mode 1 (normal)</text>

  <!-- Arrow P2 → Transition -->
  <line x1="370" y1="267" x2="370" y2="300" stroke="#888888" stroke-width="2" marker-end="url(#arrowD)"/>
  <text x="395" y="288" font-family="monospace" font-size="7" fill="#ffcc44">Core HP = 0</text>

  <!-- ====== TRANSITION BOX ====== -->
  <rect x="270" y="302" width="200" height="70" rx="8" fill="#1a1800" stroke="#ffcc44" stroke-width="2" stroke-dasharray="6 3" filter="url(#shadow)"/>
  <text x="370" y="322" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffcc44" font-weight="bold">TRANSITION</text>
  <text x="370" y="338" text-anchor="middle" font-family="monospace" font-size="8" fill="#cccccc">Death flash → VRAM DMA</text>
  <text x="370" y="350" text-anchor="middle" font-family="monospace" font-size="8" fill="#cccccc">BG Mode 1 → Mode 7</text>
  <text x="370" y="362" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffcc44">IrisCircleEffect reveal</text>

  <!-- Arrow Transition → P3 -->
  <line x1="472" y1="337" x2="528" y2="260" stroke="#888888" stroke-width="2" marker-end="url(#arrowR)"/>

  <!-- ====== PHASE 3 BOX ====== -->
  <rect x="530" y="65" width="240" height="285" rx="8" fill="#081820" stroke="#22ffaa" stroke-width="2" filter="url(#shadow)"/>
  <rect x="530" y="65" width="240" height="28" rx="8" fill="url(#p3color)"/>
  <rect x="530" y="82" width="240" height="11" fill="url(#p3color)"/>
  <text x="650" y="84" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffffff" font-weight="bold">PHASE 3 — FINAL CORE</text>

  <!-- Miniature Mode 7 scene (larger) -->
  <rect x="545" y="100" width="210" height="110" rx="4" fill="#060018"/>
  <!-- M7 floor -->
  <polygon points="575,190 710,190 720,208 565,208" fill="#150a33" opacity="0.7"/>
  <polygon points="590,175 695,175 710,190 575,190" fill="#1a0c38" opacity="0.6"/>
  <polygon points="605,163 680,163 695,175 590,175" fill="#1f0e3e" opacity="0.5"/>
  <polygon points="618,154 667,154 680,163 605,163" fill="#221044" opacity="0.4"/>
  <!-- Grid lines -->
  <line x1="645" y1="150" x2="565" y2="208" stroke="#332255" stroke-width="0.5" opacity="0.3"/>
  <line x1="645" y1="150" x2="645" y2="208" stroke="#332255" stroke-width="0.5" opacity="0.3"/>
  <line x1="645" y1="150" x2="725" y2="208" stroke="#332255" stroke-width="0.5" opacity="0.3"/>
  <!-- Final Core -->
  <ellipse cx="645" cy="130" rx="16" ry="12" fill="#115533" stroke="#22ffaa" stroke-width="1.5"/>
  <circle cx="641" cy="127" r="3" fill="#22ffaa" opacity="0.6"/>
  <circle cx="649" cy="127" r="3" fill="#22ffaa" opacity="0.6"/>
  <!-- Orbital cannons -->
  <rect x="580" y="122" width="10" height="10" rx="2" fill="#885500" stroke="#ffaa44" stroke-width="1"/>
  <rect x="700" y="148" width="10" height="10" rx="2" fill="#885500" stroke="#ffaa44" stroke-width="1"/>
  <!-- Orbit paths -->
  <ellipse cx="595" cy="140" rx="25" ry="25" fill="none" stroke="#ffaa44" stroke-width="0.5" stroke-dasharray="3 4" opacity="0.3"/>
  <ellipse cx="700" cy="140" rx="25" ry="25" fill="none" stroke="#ffaa44" stroke-width="0.5" stroke-dasharray="3 4" opacity="0.3"/>
  <!-- Bullets -->
  <circle cx="605" cy="158" r="2" fill="#ffdd44"/>
  <circle cx="690" cy="170" r="2" fill="#ffdd44"/>
  <!-- Mini-boss -->
  <circle cx="665" cy="180" r="6" fill="#443366" stroke="#8866cc" stroke-width="1"/>
  <!-- Player -->
  <rect x="633" y="182" width="6" height="10" rx="1" fill="#4466aa"/>
  <circle cx="636" cy="178" r="3" fill="#ffcc99"/>

  <!-- Phase 3 description -->
  <text x="650" y="226" text-anchor="middle" font-family="monospace" font-size="8" fill="#cccccc">Mode 7 rotating arena</text>
  <text x="650" y="238" text-anchor="middle" font-family="monospace" font-size="8" fill="#cccccc">2 orbital cannons + directional fire</text>
  <text x="650" y="250" text-anchor="middle" font-family="monospace" font-size="8" fill="#cccccc">Mini-bosses spawn on Core hit</text>
  <text x="650" y="262" text-anchor="middle" font-family="monospace" font-size="8" fill="#22ffaa">Body segments on BG layer</text>
  <text x="650" y="282" text-anchor="middle" font-family="monospace" font-size="7" fill="#888888">14 actors (peak), ~30 OAM</text>
  <text x="650" y="294" text-anchor="middle" font-family="monospace" font-size="7" fill="#888888">BG Mode 7, HDMA: M7A-M7D</text>

  <!-- P3 sub-phases -->
  <rect x="545" y="305" width="210" height="35" rx="4" fill="#0a1a15" stroke="#22aa66" stroke-width="1"/>
  <text x="650" y="318" text-anchor="middle" font-family="monospace" font-size="7" fill="#22aa66">Sub-phases: Normal → Enraged (health &lt; 50%)</text>
  <text x="650" y="330" text-anchor="middle" font-family="monospace" font-size="7" fill="#22aa66">Mode 7 rotation speed increases with damage</text>

  <!-- ====== VICTORY BOX ====== -->
  <rect x="540" y="380" width="220" height="55" rx="8" fill="#1a1a08" stroke="#ffee44" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="400" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffee44" font-weight="bold">★ VICTORY</text>
  <text x="650" y="415" text-anchor="middle" font-family="monospace" font-size="8" fill="#cccccc">code_09BA38 end-of-fight handler</text>
  <text x="650" y="427" text-anchor="middle" font-family="monospace" font-size="8" fill="#cccccc">Cleanup actors → Return to map</text>

  <!-- Arrow P3 → Victory -->
  <line x1="650" y1="345" x2="650" y2="378" stroke="#888888" stroke-width="2" marker-end="url(#arrowD)"/>
  <text x="672" y="365" font-family="monospace" font-size="7" fill="#ffee44">Final Core HP = 0</text>

  <!-- ====== ALTERNATE PATHS ====== -->
  <!-- Game Over -->
  <rect x="30" y="290" width="160" height="50" rx="8" fill="#200808" stroke="#ff2222" stroke-width="1.5"/>
  <text x="110" y="312" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff4444" font-weight="bold">GAME OVER</text>
  <text x="110" y="326" text-anchor="middle" font-family="monospace" font-size="8" fill="#cc8888">Player HP = 0 at any phase</text>

  <!-- Key stats box -->
  <rect x="30" y="370" width="230" height="115" rx="8" fill="#111122" stroke="#555577" stroke-width="1"/>
  <text x="145" y="390" text-anchor="middle" font-family="monospace" font-size="10" fill="#aaaacc" font-weight="bold">KEY TECHNICAL STATS</text>
  <text x="40" y="408" font-family="monospace" font-size="8" fill="#888888">Total unique actor types:   10</text>
  <text x="40" y="422" font-family="monospace" font-size="8" fill="#888888">Max concurrent actors:     14</text>
  <text x="40" y="436" font-family="monospace" font-size="8" fill="#888888">Vanilla code routines:     ~45</text>
  <text x="40" y="450" font-family="monospace" font-size="8" fill="#888888">WRAM custom vars:       $00F0</text>
  <text x="40" y="464" font-family="monospace" font-size="8" fill="#888888">COP calls per frame:       2-4</text>
  <text x="40" y="478" font-family="monospace" font-size="8" fill="#888888">HDMA channels (P3):        4-5</text>
</svg>